name: Atualizar status dos servidores CSRaiz

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  check-servers:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar GameDig
        run: npm install gamedig

      - name: Consultar servidores
        run: node scripts/check-servers.js

      - name: Salvar status.json
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no status."
            exit 0
          fi

          git commit -m "Atualizar status dos servidores"

          git pull --rebase origin main

          git push origin main
